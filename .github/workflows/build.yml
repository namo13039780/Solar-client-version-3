name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - name: Download pixel font
        run: |
          mkdir -p solar-client/src/main/resources/assets/solarclient/font
          curl -fL -o solar-client/src/main/resources/assets/solarclient/font/pixel.ttf "https://github.com/google/fonts/raw/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf" || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build --no-daemon
        working-directory: solar-client
      - uses: actions/upload-artifact@v4
        with:
          name: solar-client-jar
          path: solar-client/build/libs/*.jar
